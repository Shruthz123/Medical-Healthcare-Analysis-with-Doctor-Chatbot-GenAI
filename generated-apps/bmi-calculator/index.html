<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Calculate adult Body Mass Index (BMI) from height and weight in metric or imperial units. Runs entirely in your browser.">
  <title>BMI Calculator</title>
  <style>
    /* ---------- Base / reset ---------- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /* Ensure the hidden attribute always wins, even over display rules below. */
    [hidden] {
      display: none !important;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 1rem;
      min-width: 0;
      background-color: #f4f6f8;
      color: #1a1a1a; /* ~16:1 on #ffffff, ~15:1 on #f4f6f8 */
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      overflow-wrap: break-word;
    }

    main {
      width: 100%;
      max-width: 32rem;
      margin: 0 auto;
      padding: 1.25rem;
      background-color: #ffffff;
      border: 1px solid #c9cfd6;
      border-radius: 0.5rem;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.75rem;
      line-height: 1.2;
    }

    /* ---------- Visually hidden utility ---------- */
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    /* ---------- Form layout ---------- */
    form {
      margin: 0;
    }

    fieldset {
      margin: 0 0 1.25rem;
      padding: 0.75rem 1rem 1rem;
      min-width: 0; /* allow fieldset to shrink on narrow screens */
      border: 1px solid #8a939c;
      border-radius: 0.375rem;
    }

    legend {
      padding: 0 0.25rem;
      font-weight: 600;
    }

    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 2.75rem; /* comfortable touch target */
    }

    .radio-option label {
      cursor: pointer;
    }

    input[type="radio"] {
      width: 1.25rem;
      height: 1.25rem;
      margin: 0;
      accent-color: #0b5394;
      cursor: pointer;
      flex-shrink: 0;
    }

    .field {
      margin: 0 0 1rem;
    }

    .field-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0 1rem;
    }

    .field-row > .field {
      flex: 1 1 8rem;
      min-width: 0;
    }

    .field label {
      display: block;
      margin-bottom: 0.25rem;
      font-weight: 600;
    }

    input[type="text"] {
      display: block;
      width: 100%;
      max-width: 100%;
      min-height: 2.75rem;
      padding: 0.5rem 0.75rem;
      font: inherit;
      color: #1a1a1a;
      background-color: #ffffff;
      border: 2px solid #6b7580; /* ~4.7:1 against white, meets 3:1 for UI components */
      border-radius: 0.375rem;
    }

    input[type="text"][aria-invalid="true"] {
      border-color: #b00020;
      border-width: 3px;
      padding: calc(0.5rem - 1px) calc(0.75rem - 1px);
      background-color: #fff5f6;
    }

    /* ---------- Errors ---------- */
    .error {
      margin: 0.25rem 0 0;
      color: #b00020; /* ~7:1 on #ffffff */
      font-size: 0.9375rem;
      font-weight: 600;
    }

    .error:empty {
      display: none;
    }

    /* ---------- Button ---------- */
    button {
      font: inherit;
    }

    #calculate-btn {
      display: inline-block;
      width: 100%;
      min-height: 2.75rem;
      margin-top: 0.25rem;
      padding: 0.625rem 1.25rem;
      color: #ffffff;
      background-color: #0b5394; /* white on #0b5394 is ~8:1 */
      border: 2px solid #0b5394;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
    }

    #calculate-btn:hover {
      background-color: #083d6e;
      border-color: #083d6e;
    }

    #calculate-btn:active {
      background-color: #062c50;
      border-color: #062c50;
    }

    /* ---------- Focus indicators ---------- */
    input[type="text"]:focus-visible,
    input[type="radio"]:focus-visible,
    #calculate-btn:focus-visible {
      outline: 3px solid #1a1a1a;
      outline-offset: 2px;
      box-shadow: 0 0 0 5px #ffd54f;
    }

    /* Fallback for browsers without :focus-visible support */
    @supports not selector(:focus-visible) {
      input[type="text"]:focus,
      input[type="radio"]:focus,
      #calculate-btn:focus {
        outline: 3px solid #1a1a1a;
        outline-offset: 2px;
      }
    }

    /* ---------- Result ---------- */
    #result {
      margin-top: 1.25rem;
    }

    #result-content {
      padding: 0.75rem 1rem;
      background-color: #f4f6f8;
      border: 1px solid #c9cfd6;
      border-left: 0.5rem solid #6b7580;
      border-radius: 0.375rem;
    }

    #result-content p {
      margin: 0.25rem 0;
      font-size: 1.125rem;
    }

    #bmi-value {
      font-size: 1.5rem;
    }

    /* Category accents: decorative only, the text label is always shown. */
    #result[data-category="underweight"] #result-content {
      border-left-color: #1f5fa8;
    }

    #result[data-category="normal"] #result-content {
      border-left-color: #2e7d32;
    }

    #result[data-category="overweight"] #result-content {
      border-left-color: #b45309;
    }

    #result[data-category="obese"] #result-content {
      border-left-color: #b00020;
    }

    /* ---------- Disclaimer ---------- */
    #disclaimer {
      margin: 1.25rem 0 0;
      padding-top: 0.75rem;
      border-top: 1px solid #c9cfd6;
      color: #3d4650; /* ~9.5:1 on white */
      font-size: 0.9375rem;
    }

    /* ---------- Small screens (down to 320px) ---------- */
    @media (max-width: 400px) {
      body {
        padding: 0.5rem;
      }

      main {
        padding: 1rem 0.75rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      fieldset {
        padding: 0.5rem 0.75rem 0.75rem;
      }
    }

    @media (min-width: 480px) {
      #calculate-btn {
        width: auto;
      }
    }

    /* ---------- Forced colours (Windows High Contrast) ---------- */
    @media (forced-colors: active) {
      input[type="text"][aria-invalid="true"] {
        border-style: dashed;
      }

      #result-content {
        border-left-color: CanvasText;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>BMI Calculator</h1>

    <form id="bmi-form" novalidate>
      <fieldset id="unit-selector">
        <legend>Units</legend>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" id="unit-metric" name="units" value="metric" checked>
            <label for="unit-metric">Metric</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="unit-imperial" name="units" value="imperial">
            <label for="unit-imperial">Imperial</label>
          </div>
        </div>
      </fieldset>

      <div id="metric-fields">
        <div class="field">
          <label for="height-cm">Height (cm)</label>
          <input type="text" inputmode="decimal" id="height-cm" name="height-cm" autocomplete="off" aria-describedby="height-cm-error">
          <p id="height-cm-error" class="error"></p>
        </div>
        <div class="field">
          <label for="weight-kg">Weight (kg)</label>
          <input type="text" inputmode="decimal" id="weight-kg" name="weight-kg" autocomplete="off" aria-describedby="weight-kg-error">
          <p id="weight-kg-error" class="error"></p>
        </div>
      </div>

      <div id="imperial-fields" hidden>
        <div class="field-row">
          <div class="field">
            <label for="height-ft">Height (ft)</label>
            <input type="text" inputmode="numeric" id="height-ft" name="height-ft" autocomplete="off" aria-describedby="height-ft-error">
            <p id="height-ft-error" class="error"></p>
          </div>
          <div class="field">
            <label for="height-in">Height (in)</label>
            <input type="text" inputmode="decimal" id="height-in" name="height-in" autocomplete="off" aria-describedby="height-in-error">
            <p id="height-in-error" class="error"></p>
          </div>
        </div>
        <div class="field">
          <label for="weight-lb">Weight (lb)</label>
          <input type="text" inputmode="decimal" id="weight-lb" name="weight-lb" autocomplete="off" aria-describedby="weight-lb-error">
          <p id="weight-lb-error" class="error"></p>
        </div>
      </div>

      <button type="submit" id="calculate-btn">Calculate</button>
    </form>

    <div id="result" role="status" aria-live="polite" aria-atomic="true">
      <div id="result-content" hidden>
        <p>Your BMI: <strong id="bmi-value"></strong></p>
        <p>Category: <strong id="bmi-category"></strong></p>
      </div>
    </div>

    <p id="disclaimer">For adults 18+ only. This is not medical advice.</p>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
